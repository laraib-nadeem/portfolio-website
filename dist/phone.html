<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laraib’s portfolio — phone preview</title><style>*{box-sizing:border-box}body{margin:0;background:#101b16;color:#fff0ce;font:14px system-ui;display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden}header{height:58px;display:flex;align-items:center;gap:12px;flex:none}select,a{font:inherit;color:inherit;background:#263d30;border:1px solid #6d826a;border-radius:6px;padding:6px 9px;text-decoration:none}main{position:relative;flex:1;width:100%;overflow:hidden}#device{position:absolute;top:0;left:50%;transform-origin:top center;border:6px solid #050b08;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px #0006}iframe{display:block;border:0;width:100%;height:100%;background:#162b22}</style></head><body><header><span>Phone preview</span><select id="size" aria-label="Phone screen size"><option value="390,844">390 × 844</option><option value="375,667">375 × 667</option><option value="430,932">430 × 932</option></select><a href="./">Open site</a></header><main id="stage"><div id="device"><iframe src="./index.html" title="Laraib’s portfolio on a phone"></iframe></div></main><script>const size=document.querySelector('#size'),stage=document.querySelector('#stage'),device=document.querySelector('#device');function fit(){const[w,h]=size.value.split(',').map(Number),scale=Math.min((stage.clientWidth-20)/(w+12),(stage.clientHeight-12)/(h+12),1);device.style.width=(w+12)+'px';device.style.height=(h+12)+'px';device.style.transform='translateX(-50%) scale('+scale+')'}size.addEventListener('change',fit);new ResizeObserver(fit).observe(stage);fit();</script></body></html>
